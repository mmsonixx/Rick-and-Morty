<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./sass/main.scss" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Rick-and-Morty</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__container">
          <div class="btns">
            <button class="btn__characters">Characters</button>
            <button class="btn__episodes">Episodes</button>
          </div>

          <div class="search">
            <form class="search-form">
              <label>
                <div class="search_icon">
                  <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <input
                  id="search-movie"
                  type="search"
                  placeholder="Search"
                  data-search
                />
              </label>
            </form>
          </div>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="container">
        <div class="hero__container">
          <p class="hero__text">If you're a fan of Rick and Morty, you don't want to miss out on our app!  Start exploring the endless possibilities of Rick and Morty!</p>
          <div class="hero__wrapper">
            <img src="./img/rick-and-morty.webp" alt="" class="hero__img">
            <img src="./img/logo.webp" alt="" class="hero__logo">
          </div>
        </div>

      </div>
    </section>
  </body>
</html>
