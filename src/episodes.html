<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./sass/main.scss" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <title>Episodes</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__container">
          <a href="./index.html">
            <img src="./img/logo.webp" alt="logo" class="logo"
          /></a>

          <div class="search">
            <form class="search-form">
              <label>
                <div class="search_icon">
                  <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <input
                  id="search-movie"
                  type="search"
                  placeholder="Search"
                  data-search
                />
              </label>
            </form>
          </div>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="container">
        <div class="hero__container">
          <div class="hero__content">
            <h2 class="hero__title">Episodes</h2>
            <p class="hero__info">
             With a comprehensive guide to every episode, you can relive your favorite moments and discover new ones. From the bizarre and hilarious to the emotional and thought-provoking, our episode guide covers it all. 
            </p>
            <button class="hero__button">Back home</button>
          </div>
          <div class="hero__characters-wrapper">
            <img
              src="./img/characters/rick.webp"
              alt=""
              class="hero__img"
            />
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
